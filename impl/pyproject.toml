[project]
name = "montauk"
version = "0.0.1"
description = "Reference implementation of the Montauk Protocol (spec v0.3.0-draft)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Manuel Rodriguez", email = "manuel.rodriguez@teknios.tech" }]
dependencies = ["cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["montauk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
